<div class="login-container">
    <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Crear Cuenta</h2>
    
    <form (ngSubmit)="onRegistro()" #registroForm="ngForm">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="usuario.nombre" required placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" [(ngModel)]="usuario.apellidos" required placeholder="Tus apellidos">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="usuario.email" required email placeholder="usuario@ecodrop.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" [(ngModel)]="usuario.password" required minlength="6">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" [(ngModel)]="usuario.telefono" required>
        </div>

        <div class="form-group">
            <label for="direccionEntrega">Dirección de Entrega:</label>
            <input type="text" id="direccionEntrega" name="direccionEntrega" [(ngModel)]="usuario.direccionEntrega" required>
        </div>

        <button type="submit" class="btn" style="width: 100%;" [disabled]="!registroForm.valid">Registrarme</button>
    </form>

    <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
        ¿Ya tienes cuenta? <a routerLink="/login" style="color: var(--primary);">Inicia sesión aquí</a>
    </p>
</div>
