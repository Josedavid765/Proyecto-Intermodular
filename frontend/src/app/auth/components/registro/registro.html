<div class="container">
  <h2>Crear Cuenta en EcoDrop</h2>
  
  <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
    
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="nuevoUsuario.nombre" placeholder="Tu nombre" required>
    </div>

    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" [(ngModel)]="nuevoUsuario.apellido" placeholder="Tu apellido" required>
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" [(ngModel)]="nuevoUsuario.email" placeholder="ejemplo@correo.com" required email>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" [(ngModel)]="nuevoUsuario.password" placeholder="Mínimo 6 caracteres" required minlength="6">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" name="telefono" [(ngModel)]="nuevoUsuario.telefono" placeholder="600000000" required>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección de Entrega</label>
      <input type="text" id="direccion" name="direccion" [(ngModel)]="nuevoUsuario.direccionEntrega" placeholder="Calle, Número, Ciudad" required>
    </div>
    
    <button type="submit" [disabled]="!registroForm.valid">Registrarme</button>
  </form>
</div>
