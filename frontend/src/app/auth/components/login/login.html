<div class="login-container">
    <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Acceso Clientes</h2>
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="credentials.email" placeholder="usuario@ecodrop.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;" [disabled]="!loginForm.valid">Entrar</button>
    </form>
    <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
        ¿No tienes cuenta? <a routerLink="/registro" style="color: var(--primary);">Regístrate aquí</a>
    </p>
</div>
