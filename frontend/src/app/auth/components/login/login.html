<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <div *ngIf="error" class="state-message state-error">
        <p class="error-text">{{ error }}</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input type="email" id="email" name="email" [(ngModel)]="credentials.email" #email="ngModel" required email placeholder="email@ejemplo.com">
            </div>
            <div *ngIf="email.invalid && (email.dirty || email.touched)" class="field-error">
                <span *ngIf="email.errors?.['required']">El email es obligatorio</span>
                <span *ngIf="email.errors?.['email']">Ingresa un email válido</span>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" name="password" [(ngModel)]="credentials.password" #password="ngModel" required placeholder="Tu contraseña">
            </div>
            <div *ngIf="password.invalid && (password.dirty || password.touched)" class="field-error">
                <span *ngIf="password.errors?.['required']">La contraseña es obligatoria</span>
            </div>
        </div>

        <button type="submit" class="btn btn-submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <p class="auth-link">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
</div>
