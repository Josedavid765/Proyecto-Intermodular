<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">🌿</div>
      <h2>¡Hola de nuevo!</h2>
      <p>Entra en tu cuenta de <strong>EcoDrop</strong></p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-icon-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="credentials.email" 
            placeholder="ejemplo@correo.com" 
            required 
            email
            #emailInput="ngModel"
            [class.is-invalid]="emailInput.invalid && emailInput.touched">
        </div>
        <small class="error-text" *ngIf="emailInput.invalid && emailInput.touched">
          Introduce un email válido
        </small>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a href="#" class="forgot-link">¿La has olvidado?</a>
        </div>
        <div class="input-icon-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="credentials.password" 
            placeholder="Introduce tu contraseña" 
            required
            #passInput="ngModel"
            [class.is-invalid]="passInput.invalid && passInput.touched">
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!loginForm.valid">
        Iniciar Sesión
      </button>

      <div class="auth-footer">
        <p>¿No tienes cuenta todavía? <a routerLink="/registro">Crea una ahora</a></p>
      </div>
    </form>
  </div>
</div>k
